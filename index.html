<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07111f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Promptoteca"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icons/icon-192.png"><title>Promptoteca</title><style>
:root{--bg:#07111f;--card:#0d1b2e;--card2:#10233b;--line:#1b3656;--text:#f5f8ff;--muted:#8da4bf;--blue:#4da3ff;--blue2:#176bce;--danger:#ff6680}*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(circle at 100% 0,#102e55 0,transparent 32%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,sans-serif;min-height:100%}body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}button,input,textarea,select{font:inherit}.shell{max-width:760px;margin:auto;padding:18px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;margin:8px 0 22px}.brand{font-size:25px;font-weight:800;letter-spacing:-.8px}.brand b{color:var(--blue)}.sub{color:var(--muted);font-size:12px;margin-top:3px}.btn{border:1px solid var(--line);background:var(--card2);color:var(--text);border-radius:13px;padding:11px 14px;font-weight:700}.btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2));border:0}.btn.danger{color:#ff9aac}.search{width:100%;padding:14px 16px;border-radius:15px;border:1px solid var(--line);background:#0a1728;color:var(--text);outline:0;margin-bottom:13px}.toolbar{display:flex;gap:8px;overflow:auto;padding-bottom:10px}.chip{white-space:nowrap;border:1px solid var(--line);background:#0a1728;color:var(--muted);border-radius:999px;padding:8px 12px}.chip.active{color:white;border-color:#337fca;background:#12365b}.card{background:linear-gradient(145deg,rgba(17,38,64,.95),rgba(10,25,43,.96));border:1px solid var(--line);border-radius:19px;padding:16px;margin:11px 0;box-shadow:0 12px 30px #0003}.ctop{display:flex;justify-content:space-between;gap:12px}.title{font-weight:800;font-size:17px}.meta{font-size:12px;color:var(--muted);margin:5px 0 12px}.body{white-space:pre-wrap;color:#d9e6f5;font-size:14px;line-height:1.45;max-height:150px;overflow:hidden}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.empty{text-align:center;color:var(--muted);padding:55px 15px}.fab{position:fixed;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border:0;border-radius:19px;background:linear-gradient(135deg,#5ab0ff,#176bce);color:white;font-size:30px;box-shadow:0 12px 30px #006bd866}.overlay{display:none;position:fixed;inset:0;background:#050c16eF;z-index:10;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));overflow:auto}.overlay.show{display:block}.modal{max-width:650px;margin:auto}.modal h2{margin:6px 0 18px}.field{margin:12px 0}.field label{display:block;color:var(--muted);font-size:12px;font-weight:700;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#09182a;color:white;border-radius:13px;padding:13px;outline:none}.field textarea{min-height:210px;resize:vertical}.row{display:flex;gap:9px}.row>*{flex:1}.notice{font-size:12px;color:var(--muted);line-height:1.4;margin:12px 0}.section{margin-top:25px;color:#b9cce1;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.8px}.toast{position:fixed;left:50%;bottom:95px;transform:translateX(-50%) translateY(15px);opacity:0;background:#e9f4ff;color:#08213d;padding:10px 14px;border-radius:999px;font-weight:800;transition:.2s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body><main class="shell"><div class="top"><div><div class="brand">Prompt<b>oteca</b></div><div class="sub">Tu biblioteca privada de prompts</div></div><button class="btn" onclick="openBackup()">Respaldo</button></div><input id="search" class="search" placeholder="Buscar prompts…" oninput="render()"><div id="chips" class="toolbar"></div><div id="list"></div></main><button class="fab" aria-label="Nuevo prompt" onclick="openEditor()">+</button>
<div id="editor" class="overlay"><div class="modal"><div class="row"><button class="btn" onclick="closeEditor()">Cancelar</button><button class="btn primary" onclick="savePrompt()">Guardar</button></div><h2 id="editorTitle">Nuevo prompt</h2><input id="pid" type="hidden"><div class="field"><label>TÍTULO</label><input id="ptitle" placeholder="Ej. Revisar CV"></div><div class="field"><label>CATEGORÍA</label><input id="pcat" list="catlist" placeholder="Ej. Trabajo"><datalist id="catlist"></datalist></div><div class="field"><label>ETIQUETAS</label><input id="ptags" placeholder="qa, cv, inglés"></div><div class="field"><label>PROMPT</label><textarea id="pbody" placeholder="Escribe tu prompt. Usa [tema] o [estilo] para variables…"></textarea></div><div class="notice">Las variables entre corchetes, como [tema], se pueden completar antes de copiar.</div><button id="deleteBtn" class="btn danger" style="width:100%;display:none" onclick="deletePrompt()">Eliminar prompt</button></div></div>
<div id="backup" class="overlay"><div class="modal"><button class="btn" onclick="closeBackup()">Cerrar</button><h2>Respaldo</h2><p class="notice">Exporta periódicamente tu biblioteca. El archivo JSON permite restaurar categorías, etiquetas y prompts en este u otro iPhone.</p><div class="row"><button class="btn primary" onclick="exportData()">Exportar JSON</button><button class="btn" onclick="document.getElementById('importFile').click()">Importar JSON</button></div><input id="importFile" type="file" accept="application/json,.json" hidden onchange="importData(this)"><div class="section">Categorías</div><div class="field"><input id="newcat" placeholder="Nueva categoría"></div><button class="btn" onclick="addCategory()">Crear categoría</button><div id="catmanage"></div></div></div><div id="toast" class="toast"></div>
<script>
const KEY='promptoteca.v1'; let db=load(), selected='Todos';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{prompts:[],categories:[]}}catch(e){return{prompts:[],categories:[]}}} function persist(){localStorage.setItem(KEY,JSON.stringify(db))} function esc(s=''){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))} function uid(){return crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}
function categories(){return [...new Set([...db.categories,...db.prompts.map(p=>p.category).filter(Boolean)])].sort((a,b)=>a.localeCompare(b))} function render(){let cats=categories(); document.getElementById('chips').innerHTML=['Todos',...cats].map(c=>`<button class="chip ${selected===c?'active':''}" onclick="selected=${JSON.stringify(c)};render()">${esc(c)} <small>${c==='Todos'?db.prompts.length:db.prompts.filter(p=>p.category===c).length}</small></button>`).join(''); document.getElementById('catlist').innerHTML=cats.map(c=>`<option value="${esc(c)}">`).join(''); let q=document.getElementById('search').value.trim().toLowerCase(); let ps=db.prompts.filter(p=>(selected==='Todos'||p.category===selected)&&(!q||[p.title,p.body,p.category,(p.tags||[]).join(' ')].join(' ').toLowerCase().includes(q))).sort((a,b)=>(b.updated||0)-(a.updated||0)); document.getElementById('list').innerHTML=ps.length?ps.map(p=>`<article class="card"><div class="ctop"><div><div class="title">${esc(p.title||'Sin título')}</div><div class="meta">${esc(p.category||'Sin categoría')}${p.tags?.length?' · '+p.tags.map(x=>'#'+esc(x)).join(' '):''}</div></div></div><div class="body">${esc(p.body)}</div><div class="actions"><button class="btn primary" onclick="copyPrompt('${p.id}')">Copiar</button><button class="btn" onclick="openEditor('${p.id}')">Editar</button></div></article>`).join(''):`<div class="empty"><b>No hay prompts aquí.</b><br><br>Toca + para crear el primero.</div>`}
function openEditor(id){let p=db.prompts.find(x=>x.id===id); pid.value=p?.id||''; ptitle.value=p?.title||''; pcat.value=p?.category||''; ptags.value=(p?.tags||[]).join(', '); pbody.value=p?.body||''; editorTitle.textContent=p?'Editar prompt':'Nuevo prompt'; deleteBtn.style.display=p?'block':'none'; editor.classList.add('show')} function closeEditor(){editor.classList.remove('show')} function savePrompt(){if(!pbody.value.trim())return toast('Escribe un prompt'); let p={id:pid.value||uid(),title:ptitle.value.trim()||'Sin título',category:pcat.value.trim(),tags:ptags.value.split(',').map(x=>x.trim()).filter(Boolean),body:pbody.value.trim(),updated:Date.now()}; let i=db.prompts.findIndex(x=>x.id===p.id); i>=0?db.prompts[i]=p:db.prompts.push(p); if(p.category&&!db.categories.includes(p.category))db.categories.push(p.category); persist();closeEditor();render();toast('Guardado')} function deletePrompt(){if(!confirm('¿Eliminar este prompt?'))return;db.prompts=db.prompts.filter(x=>x.id!==pid.value);persist();closeEditor();render();toast('Eliminado')}
async function copyPrompt(id){let p=db.prompts.find(x=>x.id===id), text=p.body; let vars=[...new Set([...text.matchAll(/\[([^\]]+)\]/g)].map(m=>m[1]))]; for(let v of vars){let val=prompt(`Completa [${v}]`,v); if(val!==null&&val!==v) text=text.split('['+v+']').join(val)} try{await navigator.clipboard.writeText(text)}catch(e){let t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()} toast('Prompt copiado')}
function openBackup(){backup.classList.add('show');renderCats()} function closeBackup(){backup.classList.remove('show')} function addCategory(){let c=newcat.value.trim();if(c&&!db.categories.includes(c)){db.categories.push(c);persist();newcat.value='';renderCats();render()}} function renderCats(){catmanage.innerHTML=categories().map(c=>`<div class="card" style="display:flex;justify-content:space-between;align-items:center;padding:12px 14px"><span>${esc(c)}</span><button class="btn danger" onclick='removeCategory(${JSON.stringify(c)})'>Quitar</button></div>`).join('')} function removeCategory(c){db.categories=db.categories.filter(x=>x!==c);persist();renderCats();render()}
function exportData(){let blob=new Blob([JSON.stringify({...db,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='promptoteca-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();URL.revokeObjectURL(a.href);toast('Respaldo creado')} function importData(input){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.prompts)||!Array.isArray(d.categories))throw 0;if(!confirm(`Importar ${d.prompts.length} prompts? Reemplazará la biblioteca actual.`))return;db={prompts:d.prompts,categories:d.categories};persist();render();renderCats();toast('Biblioteca restaurada')}catch(e){alert('El archivo no es un respaldo válido de Promptoteca.')}input.value=''};r.readAsText(f)} function toast(s){let t=document.getElementById('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
render(); if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));
</script></body></html>
